      <stop offset="0.5" stop-color="#52D7E6"/>
      <stop offset="1" stop-color="#FFB86B"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#29405D" stroke-width="1" opacity=".42"/>
    </pattern>
