<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Davi Silva Soares — Desenvolvedor Full Stack</title>
  <desc id="description">Banner escuro com o nome de Davi, tecnologias e cartões que representam frontend, backend e banco de dados.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090D1B"/>
